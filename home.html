<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Through Our Lens | Marvin Studio</title>
  <link rel="stylesheet" href="home.css">
  <script src="home.js" defer></script>
</head>
<body class="home">
  <header class="home-header">
    <a class="home-logo" href="index.html" aria-label="Marvin Studio intro">
      Marvin <span>studio</span>
    </a>
    <details class="home-menu">
      <summary aria-label="Menu"><span></span><span></span><span></span></summary>
      <nav aria-label="Main navigation">
        <a href="index.html">Intro</a>
        <a href="#through-our-lens">Through Our Lens</a>
      </nav>
    </details>
  </header>

  <main>
    <section class="viewfinder" id="through-our-lens" aria-labelledby="lens-title">
      <div class="viewfinder-track">
        <video class="viewfinder-video" src="assets/home/ikea.mp4" poster="assets/home/preview-img-ikea.jpg" preload="metadata" playsinline aria-label="IKEA" data-caption="Event highlight"></video>
        <video class="viewfinder-video" src="assets/wedding-billy.mp4" poster="assets/home/preview-img-billywedding.jpg" preload="metadata" playsinline aria-label="Billy’s Wedding" data-caption="Wedding highlight" aria-hidden="true"></video>
      </div>

      <div class="viewfinder-frame" aria-hidden="true"></div>
      <div class="camera-status" aria-hidden="true">
        <span class="camera-rec">REC</span>
        <span class="camera-id">Marvin Cam / 01</span>
      </div>

      <h1 id="lens-title" class="lens-title">Through <em>Our Lens</em></h1>

      <div class="focus-frame">
        <button class="camera-play" type="button" aria-label="Play IKEA"></button>
      </div>

      <footer class="camera-footer">
        <div class="camera-caption">
          <div>
            <h2 aria-live="polite">IKEA</h2>
            <p>Event highlight</p>
          </div>
          <span class="camera-time">00:00</span>
        </div>
        <div class="camera-controls">
          <div class="camera-navigation">
            <button class="camera-arrow camera-prev" type="button" aria-label="Previous video" aria-disabled="true">←</button>
            <button class="camera-arrow camera-next" type="button" aria-label="Next video">→</button>
            <span class="camera-count">01 / 02</span>
          </div>
          <div class="exposure-meter" aria-hidden="true">
            <span>−2</span><span>−1</span><span>0</span><span>+1</span><span>+2</span>
          </div>
        </div>
      </footer>
    </section>

    <div class="gallery-panel">
      <section class="photo-collage" aria-label="Event photo collage">
        <div class="tablet-frame">
          <ul class="photo-strip" id="photo-strip" tabindex="0" aria-label="Scrollable event photos">
            <li><img src="assets/home/collage/ikea/3.jpg" alt="IKEA event photo 1" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/4.jpg" alt="IKEA event photo 2" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/8.jpg" alt="IKEA event photo 3" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/17.jpg" alt="IKEA event photo 4" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/20.jpg" alt="IKEA event photo 5" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/21.jpg" alt="IKEA event photo 6" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/24.jpg" alt="IKEA event photo 7" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/40.jpg" alt="IKEA event photo 8" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/47.jpg" alt="IKEA event photo 9" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/55.jpg" alt="IKEA event photo 10" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/72.jpg" alt="IKEA event photo 11" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/81.jpg" alt="IKEA event photo 12" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/91.jpg" alt="IKEA event photo 13" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/100.jpg" alt="IKEA event photo 14" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/102.jpg" alt="IKEA event photo 15" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/104.jpg" alt="IKEA event photo 16" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/121.jpg" alt="IKEA event photo 17" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/123.jpg" alt="IKEA event photo 18" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/138.jpg" alt="IKEA event photo 19" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/179.jpg" alt="IKEA event photo 20" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/181.jpg" alt="IKEA event photo 21" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/257.jpg" alt="IKEA event photo 22" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/1000001906.jpg" alt="IKEA event photo 23" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/IMG_8363.jpg" alt="IKEA event photo 24" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/IMG_8437.jpg" alt="IKEA event photo 25" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/IMG_8549.jpg" alt="IKEA event photo 26" loading="lazy" decoding="async"></li>
            <li><img src="assets/home/collage/ikea/IMG_8641.jpg" alt="IKEA event photo 27" loading="lazy" decoding="async"></li>
          </ul>
        </div>
      </section>

      <section class="booking-prints" aria-label="Booking">
        <div class="print-slot">
          <button class="booking-print" type="button" data-booking="Book a Session">
            <img src="assets/home/print-session.jpg" alt="">
            <span>Book a<br>Session</span><span class="booking-arrow" aria-hidden="true">→</span>
          </button>
        </div>
        <div class="print-slot">
          <button class="booking-print" type="button" data-booking="Book an Event">
            <img src="assets/home/print-event.jpg" alt="">
            <span>Book an<br>Event</span><span class="booking-arrow" aria-hidden="true">→</span>
          </button>
        </div>
      </section>
    </div>
  </main>

  <dialog class="booking-dialog" aria-labelledby="booking-title">
    <h2 id="booking-title"></h2>
    <p>Online booking is currently unavailable.</p>
    <form method="dialog"><button type="submit">Close</button></form>
  </dialog>
</body>
</html>
